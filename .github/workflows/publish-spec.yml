name: Publish GeoPackage specification

# Publishes spec/gpkg-spec.md to Confluence whenever it changes on main, as
# bng-metric-backend's publish-data-dictionary.yml publishes the data
# dictionary. The `paths` filter makes the job run only when the Markdown,
# or the scripts that turn it into the page, differ in the push, so an
# unchanged page is never republished.
on:
  push:
    branches:
      - main
    paths:
      - spec/gpkg-spec.md
      - development/tools/publish_spec.py
      - development/tools/markdown_to_confluence.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish the specification to Confluence
    # Skipped, rather than failed, until the page exists and its ID is set.
    if: vars.CONFLUENCE_GPKG_SPEC_PAGE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The publish script uses the Python standard library only.
      - name: Publish to Confluence
        env:
          CONFLUENCE_BASE_URL: ${{ vars.CONFLUENCE_BASE_URL }}
          CONFLUENCE_PAGE_ID: ${{ vars.CONFLUENCE_GPKG_SPEC_PAGE_ID }}
          CONFLUENCE_USER_EMAIL: ${{ secrets.CONFLUENCE_USER_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
        run: python3 development/tools/publish_spec.py
